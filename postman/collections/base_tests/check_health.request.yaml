$kind: http-request
description: |-
  Checks whether the Microscope AI API is running and reachable.

  This request sends `GET /api/health` without authentication or a request body.

  Expected behavior:

  - Returns `200 OK`.
      
  - Returns a JSON object with `status` set to `"ok"`.
      

  This is a basic availability check. It does not verify database access or other application dependencies.
url: "{{base_url}}/api/health"
method: GET
body:
  type: formdata
  content: []
scripts:
  - type: afterResponse
    code: "pm.test(\"Response status code is 200.\", function () {\r

      \    pm.expect(pm.response.code).to.eql(200);\r

      });\r

      \r

      pm.test(\"Health status is <ok>.\", function () {\r

      \    const jsonData = pm.response.json();\r

      \    pm.expect(jsonData.status).to.eql(\"ok\");\r

      });\r\n"
    language: text/javascript
order: 1000
