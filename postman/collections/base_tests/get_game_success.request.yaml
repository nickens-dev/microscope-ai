$kind: http-request
description: |-
  Retrieves a previously created Microscope game by its server-generated ID.

  This request uses the `game_id` environment variable saved by the successful  
  game-creation request:

  ``` text
  GET /api/games/{{game_id}}

   ```
url: "{{base_url}}/api/games/{{game_id}}"
method: GET
scripts:
  - type: afterResponse
    code: "pm.test(\"Response status is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      const game = pm.response.json();\r

      \r

      pm.test(\"Returned the requested game\", function () {\r

      \    pm.expect(game.id).to.eql(pm.environment.get(\"game_id\"));\r

      });\r

      \r

      pm.test(\"Returned a complete game representation\", function () {\r

      \    pm.expect(game.title).to.be.a(\"string\");\r

      \    pm.expect(game.status).to.eql(\"setup\");\r

      \    pm.expect(game.players).to.be.an(\"array\").that.is.not.empty;\r

      \    pm.expect(game.createdAt).to.be.a(\"string\");\r

      \    pm.expect(game.updatedAt).to.be.a(\"string\");\r

      });"
    language: text/javascript
order: 6000
